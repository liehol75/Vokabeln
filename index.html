<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen auf meiner Webseite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #1a252f;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary {
            background-color: #2da44e;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2c974b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #24292e;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #000000;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hallo, Welt! 👋</h1>
        <p>Willkommen auf meiner persönlichen GitHub Pages Webseite. Diese Seite wurde mit HTML und CSS erstellt und ist jetzt live im Netz erreichbar.</p>
        
        <div class="button-group">
            <a href="https://github.com" class="btn btn-primary" target="_blank" rel="noopener">Mein GitHub Profil</a>
            <a href="mailto:beispiel@email.de" class="btn btn-secondary">Kontakt aufnehmen</a>
        </div>

        <footer>
            &copy; 2026 – Erstellt mit GitHub Pages
        </footer>
    </div>

</body>
</html>
