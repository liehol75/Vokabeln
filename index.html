<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LingoVault – Vokabel & Grammatik Trainer</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: calc(80px + var(--safe-area-bottom));
        }

        /* App Bar Header */
        header {
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lang-selector {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            outline: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Main Container */
        main {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            flex: 1;
        }

        /* Card Elements */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Tabs Navigation */
        .views-container {
            display: none;
        }

        .views-container.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Inputs & Form Styling */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Vocabulary Item List */
        .vocab-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-word {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .vocab-trans {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Quiz Trainer View */
        .quiz-card {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .quiz-type {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-prompt {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 20px 0 10px;
        }

        .quiz-subprompt {
            color: #a5b4fc;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .quiz-answer {
            width: 100%;
            margin-top: 15px;
            font-size: 1.2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Bottom Fixed Navigation Bar (iOS Optimized) */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + var(--safe-area-bottom));
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            width: 25%;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.3rem;
        }

        /* Conjugation Dynamic Fields */
        .conj-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">LingoVault ⚡</div>
        <select id="languageSelect" class="lang-selector" onchange="switchLanguage()">
            <!-- Dynamic Languages -->
        </select>
    </header>

    <!-- Main Container -->
    <main>

        <!-- VIEW 1: VOCABULARY LIST -->
        <section id="view-list" class="views-container active">
            <div class="glass-card" style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="searchInput" placeholder="Vokabeln durchsuchen..." oninput="renderVocabList()">
                <button class="btn btn-secondary" onclick="openAddModal()" style="width: auto; padding: 12px 18px;">+</button>
            </div>

            <div id="vocabList">
                <!-- Vokabel-Einträge werden hier injiziert -->
            </div>
        </section>

        <!-- VIEW 2: ADD / EDIT VOCABULARY -->
        <section id="view-add" class="views-container">
            <div class="glass-card">
                <h2 style="margin-bottom: 15px;" id="formTitle">Neue Vokabel eintragen</h2>
                <form id="vocabForm" onsubmit="saveVocab(event)">
                    <div class="form-group">
                        <label>Wort / Phrase</label>
                        <input type="text" id="inputWord" placeholder="z. B. hablar" required>
                    </div>

                    <div class="form-group">
                        <label>Übersetzung</label>
                        <input type="text" id="inputTranslation" placeholder="z. B. sprechen" required>
                    </div>

                    <div class="form-group">
                        <label>Wortart</label>
                        <select id="inputType" onchange="toggleVerbFields()">
                            <option value="substantiv">Substantiv / Sonstige</option>
                            <option value="verb">Verb (mit Konjugation)</option>
                        </select>
                    </div>

                    <!-- Verbs Conjugation Section -->
                    <div id="conjSection" class="hidden">
                        <label>Konjugationsformen (optional)</label>
                        <div class="conj-grid">
                            <input type="text" id="conjPres" placeholder="Präsens (z.B. hablo)">
                            <input type="text" id="conjPast" placeholder="Präteritum (z.B. hablé)">
                            <input type="text" id="conjPerf" placeholder="Perfekt (z.B. hablado)">
                            <input type="text" id="conjFut" placeholder="Futur (z.B. hablaré)">
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label>Grammatikregel / Notizen</label>
                        <textarea id="inputGrammar" rows="2" placeholder="z. B. Regelmäßiges Verb auf -ar"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Vokabel Speichern</button>
                </form>
            </div>
        </section>

        <!-- VIEW 3: QUIZ / TRAINER -->
        <section id="view-quiz" class="views-container">
            <div class="glass-card quiz-card">
                <div id="quizType" class="quiz-type">Übersetzung</div>
                <div id="quizPrompt" class="quiz-prompt">---</div>
                <div id="quizSubprompt" class="quiz-subprompt">---</div>
                
                <input type="text" id="quizInput" class="quiz-answer" placeholder="Deine Antwort..." autocomplete="off">
                <button class="btn btn-primary" style="margin-top: 15px;" onclick="checkAnswer()">Prüfen</button>
            </div>

            <div id="quizFeedback" class="glass-card hidden" style="text-align: center;">
                <h3 id="feedbackResult"></h3>
                <p id="feedbackDetail" style="margin-top: 5px; color: var(--text-muted);"></p>
                <button class="btn btn-secondary" style="margin-top: 15px;" onclick="nextQuestion()">Nächste Frage ➔</button>
            </div>
        </section>

        <!-- VIEW 4: SETTINGS / BACKUP -->
        <section id="view-settings" class="views-container">
            <div class="glass-card">
                <h2 style="margin-bottom: 15px;">Sprachen & Daten</h2>
                
                <div class="form-group">
                    <label>Neue Sprache hinzufügen</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newLangInput" placeholder="z. B. Spanisch">
                        <button class="btn btn-primary" style="width: auto;" onclick="addLanguage()">Hinzufügen</button>
                    </div>
                </div>

                <hr style="border-color: var(--card-border); margin: 20px 0;">

                <h3 style="margin-bottom: 10px; font-size: 1rem;">Geräte-Wechsel & Backup</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">
                    Lade deine Daten als Datei herunter, um sie auf einem anderen Gerät einzuspielen.
                </p>

                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-secondary" onclick="exportData()">💾 Daten Exportieren (JSON)</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Daten Importieren</button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('list', this)">
            <span class="nav-icon">📚</span>
            <span>Vokabeln</span>
        </button>
        <button class="nav-item" onclick="switchTab('add', this)">
            <span class="nav-icon">➕</span>
            <span>Hinzufügen</span>
        </button>
        <button class="nav-item" onclick="switchTab('quiz', this)">
            <span class="nav-icon">🎯</span>
            <span>Abfrage</span>
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <span class="nav-icon">⚙️</span>
            <span>Daten</span>
        </button>
    </nav>

    <!-- Application Script Logic -->
    <script>
        // State Management
        let appData = JSON.parse(localStorage.getItem('lingoVaultData')) || {
            currentLang: 'Spanisch',
            languages: ['Spanisch', 'Französisch', 'Englisch'],
            vocabularies: []
        };

        let currentQuizItem = null;
        let currentQuizMode = 'translation'; // 'translation' oder 'conjugation'

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderLanguageDropdown();
            renderVocabList();
            saveToLocalStorage();
        });

        function saveToLocalStorage() {
            localStorage.setItem('lingoVaultData', JSON.stringify(appData));
        }

        // View Navigation
        function switchTab(viewId, navBtn) {
            document.querySelectorAll('.views-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${viewId}`).classList.add('active');
            if (navBtn) navBtn.classList.add('active');

            if (viewId === 'quiz') startQuiz();
            if (viewId === 'list') renderVocabList();
        }

        // Language Handling
        function renderLanguageDropdown() {
            const select = document.getElementById('languageSelect');
            select.innerHTML = '';
            appData.languages.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = lang;
                if (lang === appData.currentLang) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchLanguage() {
            appData.currentLang = document.getElementById('languageSelect').value;
            saveToLocalStorage();
            renderVocabList();
        }

        function addLanguage() {
            const input = document.getElementById('newLangInput');
            const val = input.value.trim();
            if (val && !appData.languages.includes(val)) {
                appData.languages.push(val);
                appData.currentLang = val;
                input.value = '';
                saveToLocalStorage();
                renderLanguageDropdown();
                renderVocabList();
            }
        }

        // Form Logic
        function toggleVerbFields() {
            const type = document.getElementById('inputType').value;
            const conjSection = document.getElementById('conjSection');
            if (type === 'verb') {
                conjSection.classList.remove('hidden');
            } else {
                conjSection.classList.add('hidden');
            }
        }

        function openAddModal() {
            document.getElementById('vocabForm').reset();
            toggleVerbFields();
            switchTab('add', document.querySelectorAll('.nav-item')[1]);
        }

        function saveVocab(e) {
            e.preventDefault();
            const word = document.getElementById('inputWord').value.trim();
            const translation = document.getElementById('inputTranslation').value.trim();
            const type = document.getElementById('inputType').value;
            const grammar = document.getElementById('inputGrammar').value.trim();

            const newEntry = {
                id: Date.now(),
                lang: appData.currentLang,
                word,
                translation,
                type,
                grammar,
                conjugations: type === 'verb' ? {
                    pres: document.getElementById('conjPres').value.trim(),
                    past: document.getElementById('conjPast').value.trim(),
                    perf: document.getElementById('conjPerf').value.trim(),
                    fut: document.getElementById('conjFut').value.trim(),
                } : null
            };

            appData.vocabularies.push(newEntry);
            saveToLocalStorage();
            document.getElementById('vocabForm').reset();
            switchTab('list', document.querySelectorAll('.nav-item')[0]);
        }

        // List Rendering
        function renderVocabList() {
            const container = document.getElementById('vocabList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = appData.vocabularies.filter(v => 
                v.lang === appData.currentLang && 
                (v.word.toLowerCase().includes(search) || v.translation.toLowerCase().includes(search))
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 40px 0;">Keine Vokabeln gefunden.</div>`;
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'vocab-item';
                div.innerHTML = `
                    <div>
                        <div class="vocab-word">${item.word} <span class="badge">${item.type}</span></div>
                        <div class="vocab-trans">${item.translation}</div>
                        ${item.grammar ? `<div style="font-size: 0.75rem; color: #a5b4fc; margin-top:4px;">💡 ${item.grammar}</div>` : ''}
                    </div>
                    <button onclick="deleteVocab(${item.id})" style="background:none; border:none; color: var(--accent-red); font-size:1.2rem; cursor:pointer;">🗑️</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteVocab(id) {
            appData.vocabularies = appData.vocabularies.filter(v => v.id !== id);
            saveToLocalStorage();
            renderVocabList();
        }

        // Quiz Engine
        function startQuiz() {
            const available = appData.vocabularies.filter(v => v.lang === appData.currentLang);
            const feedback = document.getElementById('quizFeedback');
            feedback.classList.add('hidden');
            document.getElementById('quizInput').value = '';

            if (available.length === 0) {
                document.getElementById('quizPrompt').textContent = "Keine Vokabeln";
                document.getElementById('quizSubprompt').textContent = "Füge zuerst Vokabeln hinzu!";
                return;
            }

            // Pick random Vocab
            currentQuizItem = available[Math.floor(Math.random() * available.length)];

            // Determine Quiz Mode (Standard Translation vs. Conjugation)
            const hasConjugations = currentQuizItem.conjugations && Object.values(currentQuizItem.conjugations).some(c => c !== "");
            
            if (hasConjugations && Math.random() > 0.5) {
                currentQuizMode = 'conjugation';
                const validForms = Object.keys(currentQuizItem.conjugations).filter(k => currentQuizItem.conjugations[k] !== "");
                const randomFormKey = validForms[Math.floor(Math.random() * validForms.length)];
                
                const formLabels = { pres: 'Präsens', past: 'Präteritum', perf: 'Perfekt', fut: 'Futur' };
                
                document.getElementById('quizType').textContent = `Konjugation (${formLabels[randomFormKey]})`;
                document.getElementById('quizPrompt').textContent = currentQuizItem.word;
                document.getElementById('quizSubprompt').textContent = `Übersetzung: ${currentQuizItem.translation}`;
                currentQuizItem.targetAnswer = currentQuizItem.conjugations[randomFormKey];
            } else {
                currentQuizMode = 'translation';
                document.getElementById('quizType').textContent = "Übersetzung";
                document.getElementById('quizPrompt').textContent = currentQuizItem.word;
                document.getElementById('quizSubprompt').textContent = currentQuizItem.grammar ? `Grammatik: ${currentQuizItem.grammar}` : "Wie lautet die Übersetzung?";
                currentQuizItem.targetAnswer = currentQuizItem.translation;
            }
        }

        function checkAnswer() {
            if (!currentQuizItem) return;

            const input = document.getElementById('quizInput').value.trim().toLowerCase();
            const target = currentQuizItem.targetAnswer.trim().toLowerCase();
            const feedback = document.getElementById('quizFeedback');
            const resTitle = document.getElementById('feedbackResult');
            const resDetail = document.getElementById('feedbackDetail');

            feedback.classList.remove('hidden');

            if (input === target) {
                resTitle.textContent = "Richtig! 🎉";
                resTitle.style.color = "var(--accent-green)";
                resDetail.textContent = `Ausgezeichnete Antwort.`;
            } else {
                resTitle.textContent = "Falsch! ❌";
                resTitle.style.color = "var(--accent-red)";
                resDetail.textContent = `Richtig wäre gewesen: "${currentQuizItem.targetAnswer}"`;
            }
        }

        function nextQuestion() {
            startQuiz();
        }

        // Backup / Export & Import
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `LingoVault_Backup_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.vocabularies && imported.languages) {
                        appData = imported;
                        saveToLocalStorage();
                        renderLanguageDropdown();
                        renderVocabList();
                        alert('Daten erfolgreich importiert!');
                    } else {
                        alert('Ungültiges Dateiformat.');
                    }
                } catch (err) {
                    alert('Fehler beim Lesen der Datei.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
