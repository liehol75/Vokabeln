<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LingoVault Ultra – Ultimate Trainer</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LingoVault">
    <link rel="apple-touch-icon" href="https://fav.farm/⚡">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --radius-lg: 20px;
            --radius-md: 12px;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: calc(85px + var(--safe-area-bottom));
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .select-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: var(--radius-md);
            outline: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        main {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            flex: 1;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .views-container {
            display: none;
        }

        .views-container.active {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .vocab-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-word {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vocab-trans {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-top: 2px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .box-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px calc(20px + var(--safe-area-bottom));
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tense-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .tense-tab {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tense-tab.active {
            background: var(--primary);
            color: white;
        }

        .conj-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        .conj-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .conj-table td:first-child {
            color: var(--text-muted);
            width: 40%;
            font-size: 0.85rem;
        }

        .quiz-card {
            min-height: 270px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .quiz-card.shake {
            animation: shake 0.4s ease-in-out;
            border-color: var(--accent-red);
        }

        .quiz-card.correct-glow {
            border-color: var(--accent-green);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .quiz-prompt {
            font-size: 1.7rem;
            font-weight: 800;
            margin: 15px 0 5px;
        }

        .box-bar-container {
            display: flex;
            gap: 6px;
            height: 12px;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        .box-bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + var(--safe-area-bottom));
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.7rem;
            cursor: pointer;
            width: 20%;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-icon { font-size: 1.2rem; }
        .hidden { display: none !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">LingoVault Ultra ⚡</div>
        <div class="header-controls">
            <select id="userSelect" class="select-btn" onchange="switchUser()">
                <option value="Holger">👤 Holger</option>
                <option value="Sanni">👤 Sanni</option>
            </select>
            <select id="languageSelect" class="select-btn" onchange="switchLanguage()"></select>
        </div>
    </header>

    <main>
        <!-- VIEW 1: VOCABULARY LIST -->
        <section id="view-list" class="views-container active">
            <div class="glass-card" style="display: flex; gap: 8px;">
                <input type="text" id="searchInput" placeholder="Vokabeln durchsuchen..." oninput="renderVocabList()">
                <button class="btn btn-secondary" onclick="openAddModal()" style="width: auto; padding: 12px 16px;">+</button>
            </div>
            <div id="vocabList"></div>
        </section>

        <!-- VIEW 2: ADD / EDIT VOCABULARY -->
        <section id="view-add" class="views-container">
            <div class="glass-card">
                <h2 style="margin-bottom: 15px;" id="formTitle">Vokabel eintragen</h2>
                <form id="vocabForm" onsubmit="saveVocab(event)">
                    <input type="hidden" id="editVocabId">
                    
                    <div class="form-group">
                        <label>Wort / Phrase / Verb (Infinitiv)</label>
                        <input type="text" id="inputWord" placeholder="z. B. hablar / to speak" required oninput="autoGenerateConjugations()">
                    </div>

                    <div class="form-group">
                        <label>Übersetzung</label>
                        <input type="text" id="inputTranslation" placeholder="z. B. sprechen" required>
                    </div>

                    <div class="form-group">
                        <label>Wortart</label>
                        <select id="inputType" onchange="toggleVerbFields()">
                            <option value="substantiv">Substantiv / Sonstige</option>
                            <option value="verb">Verb (mit Konjugationstabelle)</option>
                        </select>
                    </div>

                    <div id="conjSection" class="hidden">
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Konjugations-Modus</label>
                            <select id="conjFillMode" onchange="autoGenerateConjugations()">
                                <option value="auto">⚡ Automatisch ausfüllen (Auto-Fill)</option>
                                <option value="manual">✍️ Selbst ausfüllen (Manuell)</option>
                            </select>
                        </div>

                        <label style="color: #a5b4fc; margin-top: 10px;">Konjugation Präsens (Gegenwart)</label>
                        <div class="grid-2">
                            <input type="text" id="c_pres_1" placeholder="1. Sg (yo / I)">
                            <input type="text" id="c_pres_2" placeholder="2. Sg (tú / you)">
                            <input type="text" id="c_pres_3" placeholder="3. Sg (él / he)">
                            <input type="text" id="c_pres_4" placeholder="1. Pl (nosotros / we)">
                            <input type="text" id="c_pres_5" placeholder="2. Pl (vosotros / you)">
                            <input type="text" id="c_pres_6" placeholder="3. Pl (ellos / they)">
                        </div>

                        <label style="color: #a5b4fc; margin-top: 10px;">Präteritum (Vergangenheit)</label>
                        <div class="grid-2">
                            <input type="text" id="c_past_1" placeholder="1. Sg">
                            <input type="text" id="c_past_3" placeholder="3. Sg">
                        </div>

                        <label style="color: #a5b4fc; margin-top: 10px;">Perfekt (Partizip)</label>
                        <input type="text" id="c_perf" placeholder="z. B. hablado / spoken">
                    </div>

                    <div class="form-group" style="margin-top: 12px;">
                        <label>Beispielsatz (Optional)</label>
                        <textarea id="inputExample" rows="2" placeholder="z. B. Yo hablo español con mis amigos."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Grammatikregel / Notizen</label>
                        <input type="text" id="inputGrammar" placeholder="z. B. Regelmäßiges Verb auf -ar">
                    </div>

                    <button type="submit" class="btn btn-primary">Vokabel Speichern</button>
                </form>
            </div>
        </section>

        <!-- VIEW 3: QUIZ / TRAINER -->
        <section id="view-quiz" class="views-container">
            <!-- Quiz Configuration Toolbar -->
            <div class="glass-card" style="padding: 12px; margin-bottom: 12px;">
                <div class="grid-2">
                    <div>
                        <label>Abfrage-Richtung</label>
                        <select id="quizDirection" onchange="startQuiz()">
                            <option value="foreign_de">Fremdsprache ➔ Deutsch</option>
                            <option value="de_foreign">Deutsch ➔ Fremdsprache</option>
                            <option value="verb_conj">Verben: Konjugations-Quiz</option>
                        </select>
                    </div>
                    <div>
                        <label>Filter</label>
                        <select id="quizFilter" onchange="startQuiz()">
                            <option value="due">⏰ Nur Heute Fällige</option>
                            <option value="all">📚 Alle Vokabeln</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Main Quiz Card -->
            <div class="glass-card quiz-card" id="quizCard">
                <div style="display: flex; gap: 8px; position: absolute; top: 15px; left: 15px;">
                    <div id="quizBadge" class="badge">Box 1</div>
                    <div id="quizDueBadge" class="box-badge">Fällig</div>
                </div>
                
                <div id="quizPrompt" class="quiz-prompt">---</div>
                <div id="quizSubprompt" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">---</div>
                
                <button id="hintBtn" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem; margin-bottom: 10px;" onclick="toggleHint()">💡 Beispielsatz anzeigen</button>
                <div id="quizHint" style="font-style: italic; color: #a5b4fc; font-size: 0.85rem; margin-bottom: 15px;" class="hidden"></div>

                <div style="width: 100%; display: flex; gap: 8px;">
                    <input type="text" id="quizInput" placeholder="Deine Antwort..." autocomplete="off" onkeydown="if(event.key==='Enter') checkAnswer()">
                    <button class="btn btn-secondary" style="width: auto; padding: 0 15px;" onclick="speakQuizWord()">🔊</button>
                </div>
                <button class="btn btn-primary" style="margin-top: 12px;" id="quizCheckBtn" onclick="checkAnswer()">Prüfen</button>
            </div>

            <!-- Feedback Card -->
            <div id="quizFeedback" class="glass-card hidden" style="text-align: center;">
                <h3 id="feedbackResult"></h3>
                <p id="feedbackDetail" style="margin-top: 5px; color: var(--text-muted);"></p>
                
                <div id="feedbackActions" style="display: flex; gap: 10px; margin-top: 15px;"></div>
            </div>
        </section>

        <!-- VIEW 4: STATS & DASHBOARD -->
        <section id="view-stats" class="views-container">
            <div class="glass-card">
                <h2 style="margin-bottom: 15px;">Lern-Statistik</h2>
                
                <div class="grid-2" style="margin-bottom: 15px;">
                    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <div style="font-size: 1.6rem; font-weight: 800; color: #a5b4fc;" id="statTotal">0</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Gesamte Vokabeln</div>
                    </div>
                    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <div style="font-size: 1.6rem; font-weight: 800; color: var(--accent-gold);" id="statStreak">0 🔥</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Tages-Streak</div>
                    </div>
                </div>

                <div class="grid-2" style="margin-bottom: 15px;">
                    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <div style="font-size: 1.6rem; font-weight: 800; color: var(--accent-green);" id="statDue">0</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Heute Fällig</div>
                    </div>
                    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <div style="font-size: 1.6rem; font-weight: 800; color: #38bdf8;" id="statAccuracy">0%</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Erfolgsquote</div>
                    </div>
                </div>

                <label>Verteilung auf Fächer (Box 1 - 5)</label>
                <div class="box-bar-container" id="boxBarContainer"></div>
                <div id="boxLegend" style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 6px;"></div>
            </div>
        </section>

        <!-- VIEW 5: SETTINGS / BACKUP / CSV -->
        <section id="view-settings" class="views-container">
            <div class="glass-card">
                <h2 style="margin-bottom: 15px;">Einstellungen & Import</h2>
                
                <div class="form-group">
                    <label>Neue Sprache für <span id="settingsUser">Nutzer</span> hinzufügen</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="newLangInput" placeholder="z. B. Italienisch">
                        <button class="btn btn-primary" style="width: auto;" onclick="addLanguage()">+</button>
                    </div>
                </div>

                <hr style="border-color: var(--card-border); margin: 20px 0;">

                <h3 style="margin-bottom: 10px; font-size: 0.95rem;">Daten-Sicherung (JSON)</h3>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                    <button class="btn btn-secondary" onclick="exportData()">💾 Vollständiges Backup Exportieren</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Backup Importieren</button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </div>

                <h3 style="margin-bottom: 10px; font-size: 0.95rem;">CSV-Import (Massen-Import)</h3>
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px;">
                    Format: <code>Wort;Übersetzung;Wortart</code> (Pro Zeile eine Vokabel)
                </p>
                <textarea id="csvImportText" rows="3" placeholder="hablar;sprechen;verb&#10;casa;Haus;substantiv"></textarea>
                <button class="btn btn-primary" style="margin-top: 8px;" onclick="importCSV()">📥 CSV Importieren</button>
            </div>
        </section>
    </main>

    <!-- CONJUGATION INSPECTOR MODAL -->
    <div id="conjModal" class="modal-overlay" onclick="closeModalOnOuterClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h2 id="modalVerbTitle" style="font-size: 1.4rem;">Verb</h2>
                    <div id="modalVerbTrans" style="color: var(--text-muted); font-size: 0.9rem;">Übersetzung</div>
                </div>
                <button onclick="closeConjModal()" style="background:none; border:none; color: var(--text-main); font-size: 1.5rem; cursor:pointer;">✕</button>
            </div>

            <div class="tense-tabs">
                <button class="tense-tab active" onclick="switchTense('pres', this)">Präsens</button>
                <button class="tense-tab" onclick="switchTense('past', this)">Präteritum</button>
                <button class="tense-tab" onclick="switchTense('perf', this)">Perfekt</button>
            </div>

            <table class="conj-table" id="modalConjTable"></table>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('list', this)">
            <span class="nav-icon">📚</span>
            <span>Vokabeln</span>
        </button>
        <button class="nav-item" onclick="switchTab('add', this)">
            <span class="nav-icon">➕</span>
            <span>Neu</span>
        </button>
        <button class="nav-item" onclick="switchTab('quiz', this)">
            <span class="nav-icon">🎯</span>
            <span>Abfrage</span>
        </button>
        <button class="nav-item" onclick="switchTab('stats', this)">
            <span class="nav-icon">📊</span>
            <span>Stats</span>
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <span class="nav-icon">⚙️</span>
            <span>Daten</span>
        </button>
    </nav>

    <script>
        const BOX_INTERVALS = [0, 1, 3, 7, 14, 30]; // Tage pro Box

        let appData = JSON.parse(localStorage.getItem('lingoVaultProData')) || {
            currentUser: 'Holger',
            userLangs: { 'Holger': 'Spanisch', 'Sanni': 'Englisch' },
            languages: { 'Holger': ['Spanisch'], 'Sanni': ['Englisch'] },
            stats: { totalAnswered: 0, totalCorrect: 0, lastActiveDate: null, streakDays: 0 },
            vocabularies: []
        };

        let currentActiveVerb = null;
        let currentQuizItem = null;
        let currentQuizTargetAnswer = "";

        document.addEventListener('DOMContentLoaded', () => {
            initUserAndLang();
            checkAndUpdateStreak();
            renderVocabList();
        });

        function saveToLocalStorage() {
            localStorage.setItem('lingoVaultProData', JSON.stringify(appData));
        }

        function checkAndUpdateStreak() {
            const today = new Date().toISOString().slice(0, 10);
            if (!appData.stats) appData.stats = { totalAnswered: 0, totalCorrect: 0, lastActiveDate: null, streakDays: 0 };
            
            if (appData.stats.lastActiveDate) {
                const last = new Date(appData.stats.lastActiveDate);
                const now = new Date(today);
                const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    // Vortag aktiv
                } else if (diffDays > 1) {
                    appData.stats.streakDays = 0;
                }
            }
        }

        function recordActivity() {
            const today = new Date().toISOString().slice(0, 10);
            if (!appData.stats.lastActiveDate) {
                appData.stats.streakDays = 1;
            } else if (appData.stats.lastActiveDate !== today) {
                const last = new Date(appData.stats.lastActiveDate);
                const now = new Date(today);
                const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) appData.stats.streakDays += 1;
                else if (diffDays > 1) appData.stats.streakDays = 1;
            }
            appData.stats.lastActiveDate = today;
            saveToLocalStorage();
        }

        function initUserAndLang() {
            document.getElementById('userSelect').value = appData.currentUser;
            renderLanguageDropdown();
            document.getElementById('settingsUser').textContent = appData.currentUser;
        }

        function switchUser() {
            appData.currentUser = document.getElementById('userSelect').value;
            renderLanguageDropdown();
            document.getElementById('settingsUser').textContent = appData.currentUser;
            saveToLocalStorage();
            renderVocabList();
        }

        function renderLanguageDropdown() {
            const select = document.getElementById('languageSelect');
            select.innerHTML = '';
            const userLangs = appData.languages[appData.currentUser] || ['Standard'];
            
            userLangs.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = lang;
                if (lang === appData.userLangs[appData.currentUser]) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchLanguage() {
            const selectedLang = document.getElementById('languageSelect').value;
            appData.userLangs[appData.currentUser] = selectedLang;
            saveToLocalStorage();
            renderVocabList();
        }

        function addLanguage() {
            const input = document.getElementById('newLangInput');
            const val = input.value.trim();
            if (val) {
                if (!appData.languages[appData.currentUser]) appData.languages[appData.currentUser] = [];
                if (!appData.languages[appData.currentUser].includes(val)) {
                    appData.languages[appData.currentUser].push(val);
                    appData.userLangs[appData.currentUser] = val;
                    saveToLocalStorage();
                    renderLanguageDropdown();
                    renderVocabList();
                }
                input.value = '';
            }
        }

        function switchTab(viewId, navBtn) {
            document.querySelectorAll('.views-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${viewId}`).classList.add('active');
            if (navBtn) navBtn.classList.add('active');

            if (viewId === 'quiz') startQuiz();
            if (viewId === 'list') renderVocabList();
            if (viewId === 'stats') renderStats();
        }

        function toggleVerbFields() {
            const type = document.getElementById('inputType').value;
            document.getElementById('conjSection').className = type === 'verb' ? '' : 'hidden';
            if (type === 'verb') autoGenerateConjugations();
        }

        function autoGenerateConjugations() {
            const fillMode = document.getElementById('conjFillMode').value;
            const type = document.getElementById('inputType').value;
            const verb = document.getElementById('inputWord').value.trim().toLowerCase();
            const currentLang = appData.userLangs[appData.currentUser];

            if (type !== 'verb' || fillMode !== 'auto' || !verb) return;

            if (currentLang === 'Spanisch') {
                let stem = verb.slice(0, -2);
                let ending = verb.slice(-2);

                if (ending === 'ar') {
                    document.getElementById('c_pres_1').value = stem + 'o';
                    document.getElementById('c_pres_2').value = stem + 'as';
                    document.getElementById('c_pres_3').value = stem + 'a';
                    document.getElementById('c_pres_4').value = stem + 'amos';
                    document.getElementById('c_pres_5').value = stem + 'áis';
                    document.getElementById('c_pres_6').value = stem + 'an';
                    document.getElementById('c_past_1').value = stem + 'é';
                    document.getElementById('c_past_3').value = stem + 'ó';
                    document.getElementById('c_perf').value = stem + 'ado';
                } else if (ending === 'er' || ending === 'ir') {
                    const pres5 = ending === 'er' ? stem + 'éis' : stem + 'ís';
                    document.getElementById('c_pres_1').value = stem + 'o';
                    document.getElementById('c_pres_2').value = stem + 'es';
                    document.getElementById('c_pres_3').value = stem + 'e';
                    document.getElementById('c_pres_4').value = stem + (ending === 'er' ? 'emos' : 'imos');
                    document.getElementById('c_pres_5').value = pres5;
                    document.getElementById('c_pres_6').value = stem + 'en';
                    document.getElementById('c_past_1').value = stem + 'í';
                    document.getElementById('c_past_3').value = stem + 'ió';
                    document.getElementById('c_perf').value = stem + 'ido';
                }
            } else if (currentLang === 'Englisch') {
                let cleanVerb = verb.replace(/^to\s+/, '');
                document.getElementById('c_pres_1').value = cleanVerb;
                document.getElementById('c_pres_2').value = cleanVerb;
                document.getElementById('c_pres_3').value = cleanVerb.endsWith('s') || cleanVerb.endsWith('ch') ? cleanVerb + 'es' : cleanVerb + 's';
                document.getElementById('c_pres_4').value = cleanVerb;
                document.getElementById('c_pres_5').value = cleanVerb;
                document.getElementById('c_pres_6').value = cleanVerb;
                document.getElementById('c_past_1').value = cleanVerb + 'ed';
                document.getElementById('c_past_3').value = cleanVerb + 'ed';
                document.getElementById('c_perf').value = cleanVerb + 'ed';
            }
        }

        function openAddModal() {
            document.getElementById('vocabForm').reset();
            document.getElementById('editVocabId').value = '';
            document.getElementById('formTitle').textContent = 'Vokabel eintragen';
            toggleVerbFields();
            switchTab('add', document.querySelectorAll('.nav-item')[1]);
        }

        function saveVocab(e) {
            e.preventDefault();
            const editId = document.getElementById('editVocabId').value;
            const currentLang = appData.userLangs[appData.currentUser];
            const type = document.getElementById('inputType').value;

            const entryData = {
                id: editId ? Number(editId) : Date.now(),
                user: appData.currentUser,
                lang: currentLang,
                word: document.getElementById('inputWord').value.trim(),
                translation: document.getElementById('inputTranslation').value.trim(),
                type: type,
                example: document.getElementById('inputExample').value.trim(),
                grammar: document.getElementById('inputGrammar').value.trim(),
                box: editId ? (appData.vocabularies.find(v => v.id == editId)?.box || 1) : 1,
                nextReview: Date.now(),
                conjugations: type === 'verb' ? {
                    pres: [
                        document.getElementById('c_pres_1').value.trim(),
                        document.getElementById('c_pres_2').value.trim(),
                        document.getElementById('c_pres_3').value.trim(),
                        document.getElementById('c_pres_4').value.trim(),
                        document.getElementById('c_pres_5').value.trim(),
                        document.getElementById('c_pres_6').value.trim()
                    ],
                    past: [
                        document.getElementById('c_past_1').value.trim(),
                        document.getElementById('c_past_3').value.trim()
                    ],
                    perf: document.getElementById('c_perf').value.trim()
                } : null
            };

            if (editId) {
                const index = appData.vocabularies.findIndex(v => v.id == editId);
                if (index !== -1) appData.vocabularies[index] = entryData;
            } else {
                appData.vocabularies.push(entryData);
            }

            saveToLocalStorage();
            document.getElementById('vocabForm').reset();
            switchTab('list', document.querySelectorAll('.nav-item')[0]);
        }

        function editVocab(id) {
            const item = appData.vocabularies.find(v => v.id === id);
            if (!item) return;

            document.getElementById('editVocabId').value = item.id;
            document.getElementById('formTitle').textContent = 'Vokabel bearbeiten';
            document.getElementById('inputWord').value = item.word;
            document.getElementById('inputTranslation').value = item.translation;
            document.getElementById('inputType').value = item.type;
            document.getElementById('inputExample').value = item.example || '';
            document.getElementById('inputGrammar').value = item.grammar || '';

            toggleVerbFields();

            if (item.type === 'verb' && item.conjugations) {
                document.getElementById('conjFillMode').value = 'manual';
                if (item.conjugations.pres) {
                    item.conjugations.pres.forEach((val, i) => {
                        const el = document.getElementById(`c_pres_${i+1}`);
                        if (el) el.value = val;
                    });
                }
                if (item.conjugations.past) {
                    document.getElementById('c_past_1').value = item.conjugations.past[0] || '';
                    document.getElementById('c_past_3').value = item.conjugations.past[1] || '';
                }
                document.getElementById('c_perf').value = item.conjugations.perf || '';
            }

            switchTab('add', document.querySelectorAll('.nav-item')[1]);
        }

        function renderVocabList() {
            const container = document.getElementById('vocabList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const currentLang = appData.userLangs[appData.currentUser];
            container.innerHTML = '';

            const filtered = appData.vocabularies.filter(v => 
                v.user === appData.currentUser && 
                v.lang === currentLang && 
                (v.word.toLowerCase().includes(search) || v.translation.toLowerCase().includes(search))
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 40px 0;">Keine Vokabeln vorhanden.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isDue = !item.nextReview || item.nextReview <= Date.now();
                const div = document.createElement('div');
                div.className = 'vocab-item';
                div.innerHTML = `
                    <div style="flex: 1;">
                        <div class="vocab-word">
                            <span>${item.word}</span>
                            <span class="badge">${item.type}</span>
                            <span class="box-badge">Box ${item.box || 1}</span>
                            ${isDue ? `<span style="color:var(--accent-gold); font-size:0.75rem;">⏰ Fällig</span>` : ''}
                            <button class="audio-btn" onclick="speakText('${item.word}')">🔊</button>
                        </div>
                        <div class="vocab-trans">${item.translation}</div>
                        ${item.example ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">💬 "${item.example}"</div>` : ''}
                    </div>
                    <div style="display:flex; gap:4px; align-items:center;">
                        ${item.type === 'verb' ? `<button class="btn btn-secondary" style="padding:6px 10px; width:auto; font-size:0.8rem;" onclick="openConjModal(${item.id})">🔍</button>` : ''}
                        <button class="btn btn-secondary" style="padding:6px 10px; width:auto; font-size:0.8rem;" onclick="editVocab(${item.id})">✏️</button>
                        <button onclick="deleteVocab(${item.id})" style="background:none; border:none; color: var(--accent-red); font-size:1.1rem; cursor:pointer; padding: 4px;">🗑️</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteVocab(id) {
            appData.vocabularies = appData.vocabularies.filter(v => v.id !== id);
            saveToLocalStorage();
            renderVocabList();
        }

        function openConjModal(id) {
            currentActiveVerb = appData.vocabularies.find(v => v.id === id);
            if (!currentActiveVerb) return;

            document.getElementById('modalVerbTitle').textContent = currentActiveVerb.word;
            document.getElementById('modalVerbTrans').textContent = currentActiveVerb.translation;
            
            switchTense('pres', document.querySelectorAll('.tense-tab')[0]);
            document.getElementById('conjModal').classList.add('active');
        }

        function closeConjModal() {
            document.getElementById('conjModal').classList.remove('active');
        }

        function closeModalOnOuterClick(e) {
            if (e.target.id === 'conjModal') closeConjModal();
        }

        function switchTense(tense, tabBtn) {
            document.querySelectorAll('.tense-tab').forEach(b => b.classList.remove('active'));
            if(tabBtn) tabBtn.classList.add('active');

            const table = document.getElementById('modalConjTable');
            table.innerHTML = '';

            const isSpanish = appData.userLangs[appData.currentUser] === 'Spanisch';
            const persons = isSpanish ? 
                ['yo', 'tú', 'él / ella / ud.', 'nosotros', 'vosotros', 'ellos / ellas'] : 
                ['I', 'you', 'he / she / it', 'we', 'you (all)', 'they'];

            const conjs = currentActiveVerb.conjugations;

            if (tense === 'pres' && conjs && conjs.pres) {
                conjs.pres.forEach((val, idx) => {
                    if (val) addConjRow(table, persons[idx], val);
                });
            } else if (tense === 'past' && conjs && conjs.past) {
                if (conjs.past[0]) addConjRow(table, persons[0] + ' / ' + persons[1], conjs.past[0]);
                if (conjs.past[1]) addConjRow(table, persons[2], conjs.past[1]);
            } else if (tense === 'perf' && conjs && conjs.perf) {
                addConjRow(table, 'Partizip Perfekt', conjs.perf);
            }

            if (table.innerHTML === '') {
                table.innerHTML = `<tr><td colspan="2" style="text-align:center; color:var(--text-muted);">Keine Formen eingetragen.</td></tr>`;
            }
        }

        function addConjRow(table, label, val) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${label}</td>
                <td style="font-weight:700; color:#a5b4fc;">
                    ${val} <button class="audio-btn" onclick="speakText('${val}')">🔊</button>
                </td>
            `;
            table.appendChild(tr);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                const currentLang = appData.userLangs[appData.currentUser];
                if (currentLang === 'Spanisch') utterance.lang = 'es-ES';
                else if (currentLang === 'Englisch') utterance.lang = 'en-US';
                else if (currentLang === 'Französisch') utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakQuizWord() {
            if (currentQuizItem) {
                const dir = document.getElementById('quizDirection').value;
                const text = dir === 'de_foreign' ? currentQuizItem.translation : currentQuizItem.word;
                speakText(text);
            }
        }

        function startQuiz() {
            const currentLang = appData.userLangs[appData.currentUser];
            const dir = document.getElementById('quizDirection').value;
            const filter = document.getElementById('quizFilter').value;

            let available = appData.vocabularies.filter(v => v.user === appData.currentUser && v.lang === currentLang);

            if (filter === 'due') {
                available = available.filter(v => !v.nextReview || v.nextReview <= Date.now());
            }

            if (dir === 'verb_conj') {
                available = available.filter(v => v.type === 'verb' && v.conjugations && v.conjugations.pres);
            }

            const card = document.getElementById('quizCard');
            card.classList.remove('shake', 'correct-glow');
            document.getElementById('quizFeedback').classList.add('hidden');
            document.getElementById('quizHint').classList.add('hidden');
            document.getElementById('quizInput').value = '';
            document.getElementById('quizCheckBtn').disabled = false;

            if (available.length === 0) {
                document.getElementById('quizPrompt').textContent = "Keine Vokabeln";
                document.getElementById('quizSubprompt').textContent = filter === 'due' ? "Alle fälligen Wörter gelernt! 🎉" : "Trage erst Vokabeln ein!";
                document.getElementById('quizDueBadge').classList.add('hidden');
                currentQuizItem = null;
                return;
            }

            available.sort((a, b) => (a.box || 1) - (b.box || 1));
            currentQuizItem = available[Math.floor(Math.random() * Math.min(available.length, 3))];

            const isDue = !currentQuizItem.nextReview || currentQuizItem.nextReview <= Date.now();
            document.getElementById('quizDueBadge').className = isDue ? 'box-badge' : 'hidden';

            document.getElementById('quizBadge').textContent = `Box ${currentQuizItem.box || 1}`;

            if (dir === 'foreign_de') {
                document.getElementById('quizPrompt').textContent = currentQuizItem.word;
                document.getElementById('quizSubprompt').textContent = "Wie lautet die deutsche Übersetzung?";
                currentQuizTargetAnswer = currentQuizItem.translation;
            } else if (dir === 'de_foreign') {
                document.getElementById('quizPrompt').textContent = currentQuizItem.translation;
                document.getElementById('quizSubprompt').textContent = `Übersetze ins ${currentLang}:`;
                currentQuizTargetAnswer = currentQuizItem.word;
            } else if (dir === 'verb_conj') {
                const persons = ['yo (1. Sg)', 'tú (2. Sg)', 'él/ella (3. Sg)', 'nosotros (1. Pl)', 'vosotros (2. Pl)', 'ellos (3. Pl)'];
                const pIndex = Math.floor(Math.random() * 6);
                const pLabel = persons[pIndex];
                
                document.getElementById('quizPrompt').textContent = `${currentQuizItem.word} (${pLabel})`;
                document.getElementById('quizSubprompt').textContent = "Konjugationsform Präsens:";
                currentQuizTargetAnswer = currentQuizItem.conjugations.pres[pIndex] || currentQuizItem.word;
            }

            if (currentQuizItem.example) {
                document.getElementById('hintBtn').classList.remove('hidden');
                const blankExample = currentQuizItem.example.replace(new RegExp(currentQuizItem.word, 'gi'), '_____');
                document.getElementById('quizHint').textContent = `"${blankExample}"`;
            } else {
                document.getElementById('hintBtn').classList.add('hidden');
            }
        }

        function toggleHint() {
            document.getElementById('quizHint').classList.toggle('hidden');
        }

        function checkAnswer() {
            if (!currentQuizItem) return;

            recordActivity();
            if (!appData.stats) appData.stats = { totalAnswered: 0, totalCorrect: 0 };
            appData.stats.totalAnswered += 1;

            const input = document.getElementById('quizInput').value.trim().toLowerCase();
            const target = currentQuizTargetAnswer.trim().toLowerCase();
            const card = document.getElementById('quizCard');
            const feedback = document.getElementById('quizFeedback');
            const resTitle = document.getElementById('feedbackResult');
            const resDetail = document.getElementById('feedbackDetail');
            const actions = document.getElementById('feedbackActions');

            feedback.classList.remove('hidden');

            if (input === target) {
                appData.stats.totalCorrect += 1;
                card.classList.add('correct-glow');
                resTitle.textContent = "Richtig! 🎉";
                resTitle.style.color = "var(--accent-green)";
                
                const nextBox = Math.min((currentQuizItem.box || 1) + 1, 5);
                currentQuizItem.box = nextBox;
                
                const daysToAdd = BOX_INTERVALS[nextBox];
                currentQuizItem.nextReview = Date.now() + (daysToAdd * 24 * 60 * 60 * 1000);
                
                resDetail.textContent = `Aufstieg in Box ${nextBox}. Nächste Wiederholung in ${daysToAdd} Tag(en).`;
                saveToLocalStorage();

                actions.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Nächste Frage ➔</button>`;
            } else {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);

                resTitle.textContent = "Nicht ganz richtig! ❌";
                resTitle.style.color = "var(--accent-red)";
                resDetail.textContent = `Möchtest du es nochmal versuchen oder die Lösung sehen?`;

                actions.innerHTML = `
                    <button class="btn btn-secondary" onclick="retryAnswer()">🔄 Nochmal versuchen</button>
                    <button class="btn btn-primary" onclick="showSolution()">👁️ Lösung anzeigen</button>
                `;
            }
        }

        function retryAnswer() {
            document.getElementById('quizFeedback').classList.add('hidden');
            const input = document.getElementById('quizInput');
            input.value = '';
            input.focus();
        }

        function showSolution() {
            const resTitle = document.getElementById('feedbackResult');
            const resDetail = document.getElementById('feedbackDetail');
            const actions = document.getElementById('feedbackActions');

            resTitle.textContent = "Lösung 💡";
            resTitle.style.color = "#a5b4fc";
            resDetail.textContent = `Die richtige Antwort lautet: "${currentQuizTargetAnswer}"`;

            currentQuizItem.box = 1;
            currentQuizItem.nextReview = Date.now();
            saveToLocalStorage();

            actions.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Nächste Frage ➔</button>`;
        }

        function nextQuestion() {
            startQuiz();
        }

        function renderStats() {
            const currentLang = appData.userLangs[appData.currentUser];
            const list = appData.vocabularies.filter(v => v.user === appData.currentUser && v.lang === currentLang);

            document.getElementById('statTotal').textContent = list.length;
            
            const dueCount = list.filter(v => !v.nextReview || v.nextReview <= Date.now()).length;
            document.getElementById('statDue').textContent = dueCount;

            const streak = (appData.stats && appData.stats.streakDays) ? appData.stats.streakDays : 0;
            document.getElementById('statStreak').textContent = `${streak} 🔥`;

            const total = (appData.stats && appData.stats.totalAnswered) ? appData.stats.totalAnswered : 0;
            const correct = (appData.stats && appData.stats.totalCorrect) ? appData.stats.totalCorrect : 0;
            const acc = total > 0 ? Math.round((correct / total) * 100) : 100;
            document.getElementById('statAccuracy').textContent = `${acc}%`;

            const boxCounts = [0, 0, 0, 0, 0, 0];
            list.forEach(v => {
                const b = v.box || 1;
                boxCounts[b] = (boxCounts[b] || 0) + 1;
            });

            const barContainer = document.getElementById('boxBarContainer');
            const legendContainer = document.getElementById('boxLegend');
            barContainer.innerHTML = '';
            legendContainer.innerHTML = '';

            const colors = ['#ef4444', '#f97316', '#f59e0b', '#3b82f6', '#10b981'];

            for (let i = 1; i <= 5; i++) {
                const count = boxCounts[i] || 0;
                const pct = list.length > 0 ? (count / list.length) * 100 : 20;

                const seg = document.createElement('div');
                seg.className = 'box-bar-segment';
                seg.style.width = `${pct}%`;
                seg.style.background = colors[i - 1];
                barContainer.appendChild(seg);

                const leg = document.createElement('span');
                leg.textContent = `B${i}: ${count}`;
                legendContainer.appendChild(leg);
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `LingoVault_Backup_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.vocabularies) {
                        appData = imported;
                        saveToLocalStorage();
                        initUserAndLang();
                        renderVocabList();
                        alert('Daten erfolgreich importiert!');
                    }
                } catch (err) {
                    alert('Fehler beim Lesen der Backup-Datei.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function importCSV() {
            const text = document.getElementById('csvImportText').value.trim();
            if (!text) return;

            const lines = text.split('\n');
            const currentLang = appData.userLangs[appData.currentUser];
            let addedCount = 0;

            lines.forEach(line => {
                const parts = line.split(';');
                if (parts.length >= 2) {
                    const word = parts[0].trim();
                    const trans = parts[1].trim();
                    const type = parts[2] ? parts[2].trim().toLowerCase() : 'substantiv';

                    if (word && trans) {
                        appData.vocabularies.push({
                            id: Date.now() + Math.random(),
                            user: appData.currentUser,
                            lang: currentLang,
                            word: word,
                            translation: trans,
                            type: type.includes('verb') ? 'verb' : 'substantiv',
                            box: 1,
                            nextReview: Date.now()
                        });
                        addedCount++;
                    }
                }
            });

            saveToLocalStorage();
            document.getElementById('csvImportText').value = '';
            alert(`${addedCount} Vokabeln erfolgreich per CSV importiert!`);
            renderVocabList();
        }
    </script>
</body>
</html>
